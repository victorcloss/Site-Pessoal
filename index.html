<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Victor Closs Duarte — Software Developer, Computer Science student. I build systems and simple, affordable websites for small businesses." />
  <title>Victor Closs Duarte</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─── NAV ─── -->
  <nav class="nav" aria-label="Main navigation">
    <a href="#inicio" class="nav__logo">VCD</a>
    <ul class="nav__links" role="list">
      <li><a href="#sobre"      data-i18n="nav.sobre"></a></li>
      <li><a href="#experiencia" data-i18n="nav.experiencia"></a></li>
      <li><a href="#projetos"   data-i18n="nav.projetos"></a></li>
      <li><a href="#negocios"   class="nav__cta" data-i18n="nav.negocios"></a></li>
    </ul>

    <div class="nav__right">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">
        <span class="lang-toggle__opt" data-lang="en">EN</span>
        <span class="lang-toggle__sep">|</span>
        <span class="lang-toggle__opt" data-lang="sv">SV</span>
      </button>
      <button class="nav__burger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="nav__mobile-menu" aria-hidden="true">
    <div class="nav__mobile-lang">
      <button class="lang-toggle lang-toggle--mobile" id="langToggleMobile" aria-label="Switch language">
        <span class="lang-toggle__opt" data-lang="en">EN</span>
        <span class="lang-toggle__sep">|</span>
        <span class="lang-toggle__opt" data-lang="sv">SV</span>
      </button>
    </div>
    <ul role="list">
      <li><a href="#sobre"       data-i18n="nav.sobre"></a></li>
      <li><a href="#experiencia" data-i18n="nav.experiencia"></a></li>
      <li><a href="#projetos"    data-i18n="nav.projetos"></a></li>
      <li><a href="#negocios"    data-i18n="nav.negocios"></a></li>
      <li><a href="#contato"     data-i18n="nav.contato"></a></li>
    </ul>
  </div>

  <main>

    <!-- ─── HERO ─── -->
    <section class="hero" id="inicio">
      <div class="container hero__inner">
        <div class="hero__content">
          <p class="label reveal" data-i18n="hero.label"></p>
          <h1 class="hero__name reveal">Victor Closs<br/><em>Duarte</em></h1>
          <p class="hero__tagline reveal" data-i18n-multiline="hero.tagline"></p>
          <div class="hero__actions reveal">
            <a href="#contato" class="btn btn--primary" data-i18n="hero.btn.contact"></a>
            <a href="#projetos" class="btn btn--ghost"  data-i18n="hero.btn.projects"></a>
          </div>
        </div>
        <div class="hero__graphic" aria-hidden="true">
          <svg class="hero__svg" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="200" cy="200" r="180" stroke="var(--mist)" stroke-width="1.5"/>
            <circle cx="200" cy="200" r="120" stroke="var(--mist)" stroke-width="1"/>
            <circle cx="200" cy="200" r="60"  stroke="var(--accent)" stroke-width="1.5" opacity="0.6"/>
            <line x1="20" y1="200" x2="380" y2="200" stroke="var(--mist)" stroke-width="1"/>
            <line x1="200" y1="20"  x2="200" y2="380" stroke="var(--mist)" stroke-width="1"/>
            <circle cx="200" cy="80"  r="4" fill="var(--accent)"/>
            <circle cx="320" cy="200" r="4" fill="var(--steel)"/>
            <circle cx="200" cy="320" r="4" fill="var(--ink)"/>
          </svg>
        </div>
      </div>
      <div class="hero__scroll-hint" aria-hidden="true">
        <span class="label">scroll</span>
        <div class="hero__scroll-line"></div>
      </div>
    </section>

    <!-- ─── SOBRE ─── -->
    <section class="section sobre" id="sobre">
      <div class="container">
        <div class="section__header reveal">
          <p class="label" data-i18n="sobre.label"></p>
          <h2 class="section__title" data-i18n="sobre.title"></h2>
        </div>
        <div class="sobre__grid">
          <div class="sobre__text reveal">
            <p data-i18n="sobre.p1"></p>
            <p data-i18n="sobre.p2"></p>
            <p data-i18n="sobre.p3"></p>
          </div>
          <div class="sobre__facts reveal">
            <div class="fact">
              <p class="label" data-i18n="sobre.fact.formation.label"></p>
              <p data-i18n="sobre.fact.formation.val"></p>
            </div>
            <div class="fact">
              <p class="label" data-i18n="sobre.fact.base.label"></p>
              <p data-i18n="sobre.fact.base.val"></p>
            </div>
            <div class="fact">
              <p class="label" data-i18n="sobre.fact.focus.label"></p>
              <p data-i18n="sobre.fact.focus.val"></p>
            </div>
            <div class="fact">
              <p class="label" data-i18n="sobre.fact.stack.label"></p>
              <p data-i18n="sobre.fact.stack.val"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── EXPERIÊNCIA ─── -->
    <section class="section experiencia" id="experiencia">
      <div class="container">
        <div class="section__header reveal">
          <p class="label" data-i18n="exp.label"></p>
          <h2 class="section__title" data-i18n="exp.title"></h2>
        </div>
        <div class="timeline">
          <div class="timeline__entry reveal">
            <div class="timeline__meta">
              <p class="label" data-i18n="exp.date"></p>
            </div>
            <div class="timeline__card">
              <div class="timeline__card-header">
                <h3 data-i18n="exp.role"></h3>
                <span class="timeline__company" data-i18n="exp.company"></span>
              </div>
              <ul class="timeline__list">
                <li data-i18n="exp.li1"></li>
                <li data-i18n="exp.li2"></li>
                <li data-i18n="exp.li3"></li>
                <li data-i18n="exp.li4"></li>
                <li data-i18n="exp.li5"></li>
              </ul>
              <div class="timeline__stack">
                <span class="tag">Python</span>
                <span class="tag">Dash</span>
                <span class="tag">PostgreSQL</span>
                <span class="tag">RTSP/HLS</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── PROJETOS ─── -->
    <section class="section projetos" id="projetos">
      <div class="container">
        <div class="section__header reveal">
          <p class="label" data-i18n="proj.label"></p>
          <h2 class="section__title" data-i18n="proj.title"></h2>
        </div>
        <div class="projetos__grid">

          <article class="projeto-card reveal">
            <div class="projeto-card__header">
              <p class="label" data-i18n="proj.intui.label"></p>
              <h3 data-i18n="proj.intui.title"></h3>
            </div>
            <p class="projeto-card__desc" data-i18n="proj.intui.desc"></p>
            <div class="projeto-card__stack">
              <span class="tag">Python</span>
              <span class="tag">Google Gemini</span>
              <span class="tag">WhatsApp API</span>
              <span class="tag">NFS-e</span>
            </div>
          </article>

          <article class="projeto-card reveal">
            <div class="projeto-card__header">
              <p class="label" data-i18n="proj.ceap.label"></p>
              <h3 data-i18n="proj.ceap.title"></h3>
            </div>
            <p class="projeto-card__desc" data-i18n="proj.ceap.desc"></p>
            <div class="projeto-card__stack">
              <span class="tag">Python</span>
              <span class="tag">Power BI</span>
              <span class="tag">CRISP-DM</span>
              <span class="tag">ETL</span>
            </div>
          </article>

          <article class="projeto-card reveal">
            <div class="projeto-card__header">
              <p class="label" data-i18n="proj.medquiz.label"></p>
              <h3 data-i18n="proj.medquiz.title"></h3>
            </div>
            <p class="projeto-card__desc" data-i18n="proj.medquiz.desc"></p>
            <div class="projeto-card__stack">
              <span class="tag">Figma</span>
              <span class="tag">Scrum</span>
              <span class="tag">Software Engineering</span>
            </div>
          </article>

          <article class="projeto-card reveal">
            <div class="projeto-card__header">
              <p class="label" data-i18n="proj.java.label"></p>
              <h3 data-i18n="proj.java.title"></h3>
            </div>
            <p class="projeto-card__desc" data-i18n="proj.java.desc"></p>
            <div class="projeto-card__stack">
              <span class="tag">Java</span>
              <span class="tag">Spring Boot</span>
              <span class="tag">JUnit</span>
              <span class="tag">Clean Architecture</span>
            </div>
          </article>

        </div>
      </div>
    </section>

    <!-- ─── SERVICES ─── -->
    <section class="section negocios" id="negocios">
      <div class="container">
        <div class="negocios__inner reveal">
          <div class="negocios__text">
            <p class="label" data-i18n="neg.label"></p>
            <h2 class="section__title" data-i18n="neg.title"></h2>
            <p data-i18n="neg.intro"></p>

            <div class="negocios__steps">
              <div class="step">
                <span class="step__num">1</span>
                <p data-i18n="neg.step1"></p>
              </div>
              <div class="step">
                <span class="step__num">2</span>
                <p data-i18n="neg.step2"></p>
              </div>
              <div class="step">
                <span class="step__num">3</span>
                <p data-i18n="neg.step3"></p>
              </div>
            </div>

            <div class="negocios__includes">
              <p class="label" data-i18n="neg.includes.label"></p>
              <ul>
                <li data-i18n="neg.inc1"></li>
                <li data-i18n="neg.inc2"></li>
                <li data-i18n="neg.inc3"></li>
              </ul>
            </div>

            <a href="https://wa.me/5548991480734?text=Ol%C3%A1%20Victor%2C%20tenho%20interesse%20em%20um%20site%20para%20meu%20neg%C3%B3cio!"
               class="btn btn--primary" target="_blank" rel="noopener"
               data-i18n="neg.btn"></a>
          </div>
          <div class="negocios__visual" aria-hidden="true">
            <div class="negocios__card-mock">
              <div class="mock__bar">
                <span></span><span></span><span></span>
              </div>
              <div class="mock__content">
                <div class="mock__logo-area"></div>
                <div class="mock__line mock__line--wide"></div>
                <div class="mock__line"></div>
                <div class="mock__line mock__line--short"></div>
                <div class="mock__btn-mock"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── CONTACT ─── -->

      <div class="container">
        <div class="contato__inner reveal">
          <p class="label" data-i18n="contact.label"></p>
          <h2 class="section__title" data-i18n="contact.title"></h2>
          <div class="contato__links">
            <a href="https://wa.me/5548991480734" class="contato__link" target="_blank" rel="noopener" aria-label="WhatsApp">

              <span data-i18n="contact.wa"></span>

              <span data-i18n="contact.li"></span>

          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ─── FOOTER ─── -->
  <footer class="footer">
    <div class="container footer__inner">
      <p data-i18n="footer.copy"></p>
      <p class="footer__sub" data-i18n="footer.sub"></p>
    </div>
  </footer>

  <!-- ─── TIMELINE DOT (signature element) ─── -->
  <div class="timeline-dot" aria-hidden="true"></div>

  <script src="translations.js"></script>
  <script src="main.js"></script>
</body>
</html>
